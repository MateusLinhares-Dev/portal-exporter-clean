[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softexpert-portal-exporter"
version = "1.0.0"
description = "Authorized Playwright PDF exporter for nested SoftExpert dashboards"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.118,<1", "uvicorn[standard]>=0.37,<1",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.43,<3", "psycopg[binary]>=3.2.10,<4",
  "alembic>=1.16,<2", "structlog>=25.4,<26",
  "APScheduler>=3.11,<4", "playwright>=1.58,<2",
]

[tool.poetry]
package-mode= false

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
