services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exporter
      POSTGRES_USER: exporter
      POSTGRES_PASSWORD: exporter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exporter -d exporter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "softexpert_exporter.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${NETWORK_SHARE_HOST_PATH:-./runtime/share}:/mnt/client-share
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "softexpert_exporter.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${NETWORK_SHARE_HOST_PATH:-./runtime/share}:/mnt/client-share
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    command: ["python", "-m", "softexpert_exporter.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
